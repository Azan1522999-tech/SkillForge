<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SkillForge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <nav>
        <a href="index.html" class="logo">
            <span>⚡</span> SkillForge
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html" class="btn-login">Login</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <h1>Create Account 🚀</h1>
            <p class="auth-sub">Start your learning journey today</p>

            <form id="signupForm">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" placeholder="Your Name" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Minimum 6 characters" required>
                </div>

                <button type="submit" class="btn-primary full-width">Create Account</button>
                <p id="signupMessage" class="auth-message"></p>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </div>
    </div>

    <script src="courses-data.js"></script>
    <script src="auth.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const msg = document.getElementById('signupMessage');
            
            msg.textContent = '';
            msg.className = 'auth-message';
            
            if (name.length < 3) {
                msg.textContent = '❌ Name must be at least 3 characters';
                msg.classList.add('error');
                return;
            }
            
            if (password.length < 6) {
                msg.textContent = '❌ Password must be at least 6 characters';
                msg.classList.add('error');
                return;
            }
            
            const result = SkillForgeAuth.signup(name, email, password);
            
            if (result.success) {
                msg.textContent = '✅ ' + result.message;
                msg.classList.add('success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                msg.textContent = '❌ ' + result.message;
                msg.classList.add('error');
            }
        });
    </script>

</body>
</html>
