<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillForge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <nav>
        <a href="index.html" class="logo">
            <span>⚡</span> SkillForge
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="signup.html" class="btn-signup">Sign Up</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <h1>Welcome Back 👋</h1>
            <p class="auth-sub">Login to continue learning</p>

            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary full-width">Login</button>
                <p id="loginMessage" class="auth-message"></p>
            </form>

            <p class="auth-switch">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="courses-data.js"></script>
    <script src="auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const msg = document.getElementById('loginMessage');
            
            msg.textContent = '';
            msg.className = 'auth-message';
            
            const result = SkillForgeAuth.login(email, password);
            
            if (result.success) {
                msg.textContent = '✅ ' + result.message;
                msg.classList.add('success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                msg.textContent = '❌ ' + result.message;
                msg.classList.add('error');
            }
        });
    </script>

</body>
</html>
